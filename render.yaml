services:
  - type: web
    name: my-fastapi-app
    runtime: python
    buildCommand: "pip install --upgrade pip && CARGO_HOME=/tmp/cargo pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CARGO_HOME
        value: /tmp/cargo
